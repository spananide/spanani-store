name: Build

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: brew install ldid xcbeautify

      - name: Build IPA
        run: make build fakesign ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SpananiStore.ipa
          path: SideStore.ipa
