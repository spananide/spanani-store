name: SpananiPreview
options:
  bundleIdPrefix: de.spanani
packages:
  SpananiUI:
    path: ../SpananiUI
targets:
  SpananiPreview:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    dependencies:
      - package: SpananiUI
        product: SpananiUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.spanani.store.preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Store Preview"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
